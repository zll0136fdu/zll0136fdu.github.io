<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Personal homepage for Leilei Zhang, School of Data Science, Fudan University.">
    <title>Leilei Zhang | Fudan University</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --ink: #182231;
        --muted: #5d6675;
        --line: #d8dee8;
        --accent: #8b1e2d;
        --accent-ink: #ffffff;
        --panel: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(139, 30, 45, 0.08), transparent 32rem),
          var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .profile {
        width: min(100%, 820px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(24, 34, 49, 0.08);
        overflow: hidden;
      }

      .header {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 24px;
        align-items: center;
        padding: 34px;
        border-bottom: 1px solid var(--line);
      }

      .avatar {
        width: 104px;
        height: 104px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.1rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .role {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1.08rem;
      }

      .content {
        padding: 30px 34px 34px;
        display: grid;
        gap: 22px;
      }

      .section {
        display: grid;
        gap: 8px;
      }

      h2 {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.2;
        color: var(--accent);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p {
        margin: 0;
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .contact {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        align-items: center;
      }

      .email {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 9px 14px;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-ink);
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      footer {
        padding: 18px 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 620px) {
        .header {
          grid-template-columns: 1fr;
          padding: 28px 22px;
        }

        .content {
          padding: 26px 22px;
        }

        footer {
          padding: 18px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="profile" aria-labelledby="name">
        <header class="header">
          <img class="avatar" src="assets/profile.svg" alt="Leilei Zhang initials">
          <div>
            <h1 id="name">Leilei Zhang</h1>
            <p class="role">School of Data Science, Fudan University</p>
          </div>
        </header>

        <div class="content">
          <section class="section" aria-labelledby="about-title">
            <h2 id="about-title">About</h2>
            <p>
              I am affiliated with the School of Data Science at Fudan University.
            </p>
          </section>

          <section class="section" aria-labelledby="contact-title">
            <h2 id="contact-title">Contact</h2>
            <div class="contact">
              <span>Email:</span>
              <a class="email" href="mailto:25210980136@m.fudan.edu.cn">25210980136@m.fudan.edu.cn</a>
            </div>
          </section>
        </div>

        <footer>
          This page is maintained as the personal homepage of Leilei Zhang.
        </footer>
      </article>
    </main>
  </body>
</html>
